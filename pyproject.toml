[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmlevaluator"
version = "1.0.0"
description = "Reproducible pipeline for deep-learning assessment of volumetric muscle loss histology"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Isaac Nkrumah", email = "isaac.nkrumah@slu.edu"},
]
keywords = ["histology", "volumetric muscle loss", "multimodal", "reproducibility"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "scikit-image>=0.20",
    # The manuscript's classical model. Reference run: 3.1.
    "xgboost>=2.0",
    "scipy>=1.9",
    "torch>=2.0",
    "torchvision>=0.15",
    "timm>=0.9",
    "omegaconf>=2.3",
    "joblib>=1.2",
    "matplotlib>=3.6",
    "Pillow>=9.0",
    "openpyxl>=3.1",
    "tqdm>=4.64",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# Pyramidal whole-slide formats (.svs/.ndpi/.mrxs) and fast large-TIFF tiling.
wsi = ["pyvips>=2.2"]
# The human ACLR red-channel preprocessing chain.
preprocess = ["opencv-python-headless>=4.7"]
notebooks = ["jupyterlab>=4.0", "ipywidgets>=8.0", "seaborn>=0.12"]
dev = ["pytest>=7.0", "nbclient>=0.8", "nbformat>=5.9"]

[project.scripts]
vmleval = "vmlevaluator.cli:main"

[tool.setuptools.packages.find]
include = ["vmlevaluator*"]

[tool.setuptools.package-data]
vmlevaluator = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
